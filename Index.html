<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Clientes · Grupo Luminex</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6ec;--ac:#0f766e;--rd:#b42318;--yl:#b54708;--gn:#067647;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--cd:#171c23;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2a313b;--ac:#2dd4bf;--rd:#f97066;--yl:#fdb022;--gn:#47cd89;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--cd:#171c23;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2a313b;--ac:#2dd4bf;--rd:#f97066;--yl:#fdb022;--gn:#47cd89;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer}.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
:root[data-theme="dark"] .pri,:root:not([data-theme="light"]) .pri{color:#06201d}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.kc{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:left}
.kc.on{outline:2px solid var(--ac)}.kc b{display:block;font-size:22px}.kc span{color:var(--mu);font-size:13px}
.al{background:var(--cd);border:1px solid var(--yl);border-radius:10px;padding:10px;margin-bottom:10px}
.al h2{font-size:14px;margin:0 0 6px;color:var(--yl)}.al div{padding:3px 0;cursor:pointer;font-size:14px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}

.rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

a{color:var(--ac)}.s{color:var(--mu);font-size:13px}

.ov.on{display:flex}.md{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;width:100%;max-width:520px}
.md label{display:block;font-size:13px;color:var(--mu);margin-top:8px}.md input,.md select,.md textarea{width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div class="w">
<div class="top"><h1>Painel de Clientes</h1><div class="rw"><span class="s" id="sv"></span><button onclick="exp()">Exportar CSV</button><button class="pri" onclick="ed(null)">+ Novo cliente</button></div></div>
<div id="bn" class="s"></div>
<div class="k" id="k"></div><div id="mt"></div><div id="al"></div><div id="tkl"></div><div id="fn"></div>
<div class="f"><input id="q" placeholder="Buscar nome, telefone, nota…" oninput="F.q=this.value;rd()"><select id="fc" onchange="F.ci=this.value;rd()"></select><select id="fg" onchange="F.sg=this.value;rd()"></select><select id="fs" onchange="F.sv=this.value;rd()"></select></div>
<div id="ls"></div><div id="ins"></div></div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div id="ts" style="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;display:none;z-index:9;font-size:14px;max-width:90%"></div>
<script>
const ST={novo:'Novo',proc:'Em processamento',ativo:'Ativo',inativo:'Inativo'};
const SV=['Atendente IA WhatsApp','Site / Landing page','Painel de gestão','Agenda e lembretes','Pacote completo','Outro'];
const SG=['Clínica','Odontologia','Laboratório','Fisio/Estética','Imobiliária','Restaurante','Academia','Pet/Veterinária','Barbearia/Salão','Educação','Loja','Outro'];
const ET=['1º contato','Descoberta','Demo','Proposta enviada','Negociação'],MP=['','Preço','Já tem sistema','Sem retorno','Sem interesse','Outro'],TP=['Contato','Demo','Proposta','Fechamento'];
let C=[],F={st:'',ci:'',sg:'',sv:'',et:'',q:''},G={Contato:15,Demo:3,Proposta:2,Fechamento:1},doc=null,E=null,tm;
const $=s=>document.getElementById(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TD=iso(new Date()),add=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const days=a=>Math.round((new Date(TD)-new Date(a))/864e5);
const brl=n=>'R$ '+(+n||0).toLocaleString('pt-BR');
const dg=s=>String(s||'').replace(/\D/g,'');
function save(){clearTimeout(tm);$('sv').textContent='Salvando…';tm=setTimeout(async()=>{if(!doc){$('sv').textContent='Sem armazenamento';return}try{await doc.set({clients:C,goals:G});$('sv').textContent='Salvo ✓'}catch(e){$('sv').textContent='Erro ao salvar'}},500)}
function fu(c){const p=c.prox,a=c.status==='ativo';if(c.status==='inativo')return null;if(!p)return c.status==='proc'?{t:'Sem próximo passo',k:'yl'}:null;const d=days(p),L=a?'Revisão ':'Follow-up ';return d>0?{t:(a?'Revisão atrasada ':'Atrasado ')+d+'d',k:'rd'}:d===0?{t:L+'hoje',k:'yl'}:{t:L+p.split('-').reverse().slice(0,2).join('/'),k:''}}
function opts(sel,all,list,key){const n={};C.forEach(c=>{if(c[key])n[c[key]]=(n[c[key]]||0)+1});const l=[...new Set([...list,...Object.keys(n)])].filter(x=>list.length?true:n[x]);sel.innerHTML='<option value="">'+all+'</option>'+l.map(x=>'<option value="'+esc(x)+'"'+(F[sel.dataset.f]===x?' selected':'')+'>'+esc(x)+' ('+(n[x]||0)+')</option>').join('')}
function rd(){ext();
const cnt={};Object.keys(ST).forEach(s=>cnt[s]=0);C.forEach(c=>cnt[c.status]=(cnt[c.status]||0)+1);
const mrr=C.filter(c=>c.status==='ativo').reduce((a,c)=>a+(+c.mensal||0),0),pip=C.filter(c=>c.status==='proc').reduce((a,c)=>a+(+c.setup||0),0);
$('k').innerHTML=Object.keys(ST).map(s=>'<button class="kc'+(F.st===s?' on':'')+'" onclick="F.st=F.st===\''+s+'\'?\'\':\''+s+'\';rd()"><b>'+cnt[s]+'</b><span>'+ST[s]+'</span></button>').join('')+'<div class="kc"><b>'+brl(mrr)+'</b><span>Recorrência mensal (ativos)</span></div><div class="kc"><b>'+brl(pip)+'</b><span>Implantação em processamento</span></div>';
const ap=C.filter(c=>{const f=fu(c);return f&&(f.k==='rd'||f.k==='yl')}).sort((a,b)=>(a.prox||'9')<(b.prox||'9')?-1:1);
$('al').innerHTML=ap.length?'<div class="al"><h2>Atenção: '+ap.length+' cliente(s) precisam de ação</h2>'+ap.slice(0,6).map(c=>'<div onclick="fic(\''+c.id+'\')">• <b>'+esc(c.nome)+'</b> · '+esc(c.cidade)+' · '+fu(c).t+'</div>').join('')+(ap.length>6?'<div class="s">e mais '+(ap.length-6)+'…</div>':'')+'</div>':'';
const fc=$('fc'),fg=$('fg'),fs=$('fs');fc.dataset.f='ci';fg.dataset.f='sg';fs.dataset.f='sv';opts(fc,'Todas as cidades',[],'cidade');opts(fg,'Todos os segmentos',SG,'segmento');opts(fs,'Todos os serviços',SV,'servico');
const q=F.q.toLowerCase();
const L=C.filter(c=>(!F.st||c.status===F.st)&&(!F.ci||c.cidade===F.ci)&&(!F.sg||c.segmento===F.sg)&&(!F.sv||c.servico===F.sv)&&(!F.et||(c.status==='proc'&&(c.etapa||ET[0])===F.et))&&(!q||[c.nome,c.fone,c.notas,c.resp].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.prox||'9')<(b.prox||'9')?-1:(a.prox||'9')>(b.prox||'9')?1:a.nome.localeCompare(b.nome));
$('ls').innerHTML=L.length?L.map(c=>{const f=fu(c),d=dg(c.fone),mob=d.length>=10&&d[d.length-9]==='9'&&d.length<=13,ds=c.ultimo?days(c.ultimo):null;
return '<div class="r"><div class="rw" style="justify-content:space-between"><h3 style="cursor:pointer;text-decoration:underline dotted" onclick="fic(\''+c.id+'\')">'+esc(c.nome)+'</h3><select onchange="stt(\''+c.id+'\',this.value)">'+Object.keys(ST).map(s=>'<option value="'+s+'"'+(c.status===s?' selected':'')+'>'+ST[s]+'</option>').join('')+'</select></div>'
+'<div class="m">'+esc(c.cidade)+' · '+esc(c.segmento||'—')+' · '+esc(c.servico||'serviço a definir')+(c.resp?' · '+esc(c.resp):'')+'</div>'
+'<div class="rw">'+(c.status==='proc'?'<span class="b">'+esc(c.etapa||ET[0])+'</span>':'')+(c.status==='inativo'&&c.motivo?'<span class="b rd">'+esc(c.motivo)+'</span>':'')+(c.dep==='Sim'?'<span class="b gn">Case ✓</span>':'')+(c.indic?'<span class="b">Indicado: '+esc(c.indic)+'</span>':'')+(f?'<span class="b '+f.k+'">'+f.t+'</span>':'')+(ds!==null?'<span class="b">Último contato há '+ds+'d</span>':'')+(c.mensal?'<span class="b gn">'+brl(c.mensal)+'/mês</span>':'')
+(d?(mob?'<a href="https://wa.me/'+(d.length<=11?'55':'')+d+'" target="_blank" rel="noopener">WhatsApp</a>':'<a href="tel:'+d+'">Ligar</a>')+'<span class="s">'+esc(c.fone)+'</span>':'')+'<button class="pri" onclick="msg(\''+c.id+'\')">Mensagem</button><button onclick="ed(\''+c.id+'\')">Editar</button></div>'
+(c.notas?'<div class="s" style="margin-top:6px">'+esc(c.notas)+'</div>':'')+'</div>'}).join(''):'<div class="r s">Nenhum cliente neste filtro. Use “+ Novo cliente” para cadastrar.</div>'}
function stt(id,s){const c=C.find(x=>x.id===id);c.status=s;c.ultimo=TD;if(s==='proc'){if(!c.prox)c.prox=add(2);if(!c.etapa)c.etapa=ET[0]}if(s==='ativo'){c.prox=add(30);(c.hist=c.hist||[]).push({d:TD,tp:'Fechamento',t:'Virou cliente ativo'})}if(s==='inativo')c.prox='';save();rd();if(s==='inativo')ed(id)}
const SEGC={'Clínica':'cl','Odontologia':'od','Laboratório':'lb','Fisio/Estética':'fe','Restaurante':'rs','Imobiliária':'im','Academia':'ac','Pet/Veterinária':'pt','Barbearia/Salão':'bb','Educação':'ed'};
const PG='o que mais toma tempo no atendimento',PG2='como chegam os interessados hoje e o que mais toma tempo no atendimento';
const CFG={cl:{ctx:'as clínicas da região',aj:'confirmar consultas, responder as mesmas dúvidas e organizar a agenda',fo:'cuidar de quem está na clínica',pg:PG,dt:'da agenda'},
od:{ctx:'as clínicas odontológicas da região',aj:'confirmar consultas, lembrar retornos e organizar a agenda',fo:'cuidar de quem está na clínica',pg:PG,dt:'da agenda'},
lb:{ctx:'os laboratórios e clínicas da região',aj:'informar horários de coleta, avisar quando o resultado fica pronto e organizar a agenda',fo:'cuidar de quem está no laboratório',pg:PG,dt:'da agenda'},
fe:{ctx:'os negócios de saúde e bem-estar da região',aj:'confirmar sessões, lembrar o cliente e organizar a agenda',fo:'atender bem cada cliente',pg:PG,dt:'da agenda'},
rs:{ctx:'os restaurantes e lanchonetes da região',aj:'receber pedidos e reservas pelo WhatsApp, responder dúvidas de cardápio, horário e entrega e organizar o atendimento',fo:'preparar e entregar bem cada pedido',pg:'como chegam os pedidos hoje e o que mais toma tempo no atendimento',dt:'dos pedidos'},
im:{ctx:'as imobiliárias da região',aj:'responder os interessados, qualificar os leads e agendar visitas',fo:'visitar e fechar negócio',pg:PG2,dt:'dos leads'},
ac:{ctx:'as academias da região',aj:'responder interessados, agendar aula experimental e lembrar a renovação do plano',fo:'cuidar dos alunos',pg:PG2,dt:'das matrículas'},
pt:{ctx:'os pet shops e clínicas veterinárias da região',aj:'agendar banho e tosa, lembrar vacinas e retornos e responder dúvidas',fo:'cuidar dos pets',pg:PG,dt:'da agenda'},
bb:{ctx:'as barbearias e salões da região',aj:'agendar horários, confirmar com o cliente e reduzir faltas',fo:'atender bem cada cliente',pg:PG,dt:'da agenda'},
ed:{ctx:'as escolas e cursos da região',aj:'responder pais e interessados sobre matrículas e turmas e enviar avisos',fo:'acompanhar os alunos',pg:PG2,dt:'das matrículas'}};
const TPL={
ab:{n:'Abertura',t:'{s}! Meu nome é Gerdyson Silva, sou do Grupo Luminex, e estou conhecendo como {ctx} organizam o atendimento. Falo com a recepção ou com o responsável pelo atendimento de {nome}? 😊\n\nEstamos levando ideias para melhorar o atendimento e a rotina da equipe. A automação já faz parte do dia a dia de muitos negócios e ajuda a {aj}, deixando a equipe com menos tarefas repetitivas e mais tempo para {fo}.\n\nAntes de propor qualquer coisa, quero entender a rotina de vocês. Você teria uns minutinhos para me contar {pg}? E, se puder, me indicar a melhor forma de falar com a gestão.\n\nMuito obrigado pela atenção! (Se preferir não receber mensagens minhas, é só avisar que eu paro.)'},
f2:{n:'Follow-up 2 dias',t:'{s}! Passando só para retomar minha mensagem, sem pressa. 😊\n\nSe fizer sentido, me indica com quem posso falar sobre a organização do atendimento e {dt} de {nome}? Obrigado! 🙏'},
f5:{n:'Follow-up final',t:'{s}! Última mensagem para não incomodar. 🙂\n\nSe fizer sentido para {nome}, me avise e eu mostro em 10 minutos como a automação pode deixar o atendimento mais leve. Se não for o momento, sem problemas, desejo muito sucesso! 🙏'},
lev:{n:'Convite para levantamento',t:'{s}! Obrigado pela conversa. 😊 Para montar algo que faça sentido para {nome}, gostaria de fazer um levantamento rápido de cerca de 30 minutos, por ligação, vídeo, áudio ou pessoalmente.\n\nQueria entender como os clientes chegam hoje, como funciona o atendimento e a organização {dt} e quantas pessoas da equipe usariam um sistema. Com isso, preparo uma proposta sob medida, sem compromisso.\n\nQual dia e horário ficam bons esta semana?'},
prop:{n:'Envio da proposta',t:'{s}! Foi ótimo conhecer a rotina de {nome}. 😊 Com base no que conversamos, preparei uma proposta sob medida, dividida em fases para vocês começarem pelo que traz resultado mais rápido.\n\nSe preferir, marcamos 15 minutos para eu explicar e tirar qualquer dúvida. Obrigado pela confiança! 🙏'},
fp:{n:'Follow-up da proposta',t:'{s}! Passando para saber se conseguiram avaliar a proposta de {nome}. 😊 Posso tirar qualquer dúvida ou ajustar algum ponto. Se preferir, marcamos 10 minutos para conversar. Obrigado! 🙏'},
dep:{n:'Pedir depoimento',t:'{s}! Aqui é o Gerdyson, do Grupo Luminex. Queria saber como está sendo o uso do sistema em {nome}. 😊 Se estiver gostando, você toparia gravar um áudio ou escrever 2 linhas sobre a experiência? Isso me ajuda muito a mostrar o trabalho para outros negócios. Muito obrigado! 🙏'}};
function sug(c){return c.status==='ativo'?'dep':c.status==='proc'?({'1º contato':'f2','Descoberta':'lev','Demo':'prop'}[c.etapa||ET[0]]||'fp'):'ab'}
function fill(k,c){const h=new Date().getHours(),sd=h<12?'bom dia':h<18?'boa tarde':'boa noite',g=CFG[SEGC[c.segmento]]||CFG.cl;let t=TPL[k].t;
if(k==='ab'&&c.segmento==='Imobiliária')t=t.split('Falo com a recepção ou com o responsável pelo atendimento de').join('Falo com o responsável por');
return t.split('{s}').join('Olá, '+sd).split('{nome}').join(c.nome).split('{ctx}').join(g.ctx).split('{aj}').join(g.aj).split('{fo}').join(g.fo).split('{pg}').join(g.pg).split('{dt}').join(g.dt)}
function msg(id,k){const c=C.find(x=>x.id===id);k=k||sug(c);E=id;
$('md').innerHTML='<h3 style="margin:0">Mensagem para '+esc(c.nome)+'</h3><label>Modelo<select id="m_k" onchange="msg(\''+id+'\',this.value)">'+Object.keys(TPL).map(x=>'<option value="'+x+'"'+(x===k?' selected':'')+'>'+TPL[x].n+'</option>').join('')+'</select></label><label>Texto (pode editar antes de enviar)<textarea id="m_t" rows="12">'+esc(fill(k,c))+'</textarea></label><div class="rw" style="margin-top:12px"><button class="pri" onclick="snd(\''+id+'\')">Abrir WhatsApp e registrar</button><button onclick="cpy()">Copiar</button><button onclick="cl2()">Fechar</button></div><div class="s" style="margin-top:6px">Ao enviar, o contato entra no histórico'+(c.status==='novo'?' e o cliente passa para Em processamento':'')+'. Número fixo: o texto é copiado.</div><div id="m_l" class="s" style="margin-top:8px"></div>';$('ov').classList.add('on')}
function cpy(){const t=$('m_t');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}}
function snd(id){const c=C.find(x=>x.id===id),k=$('m_k').value,t=$('m_t').value,d=dg(c.fone),mb=d.length>=10&&d[d.length-9]==='9'&&d.length<=13;let u='';
if(mb){u='https://wa.me/'+(d.length<=11?'55':'')+d+'?text='+encodeURIComponent(t);const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}else{cpy();toast('Número fixo: texto copiado. Ligue ou procure o WhatsApp.')}
(c.hist=c.hist||[]).push({d:TD,tp:'Contato',t:'Mensagem: '+TPL[k].n});c.ultimo=TD;if(c.status==='novo'){c.status='proc';c.etapa=ET[0]}if(k==='prop')c.etapa='Proposta enviada';if(c.status==='proc')c.prox=add(2);save();rd();$('m_l').innerHTML=(mb?'<a href="'+u+'" target="_blank" rel="noopener">Se o WhatsApp não abriu, toque aqui</a> · ':'')+'contato registrado ✓'}
const FL=[['site','Site','Site / Landing page'],['insta','Instagram ativo','Conteúdo e Instagram'],['wa','WhatsApp Business','Atendente IA WhatsApp'],['bot','Atendimento automático','Atendente IA WhatsApp'],['agd','Agendamento online','Agenda e lembretes'],['pg','Cobrança / pagamento online','Painel de gestão'],['gmb','Google Meu Negócio completo','Perfil no Google']];
function pend(c){const L=[[!!dg(c.fone),'Telefone / WhatsApp cadastrado'],[!!c.resp,'Responsável / decisor identificado'],[!!c.site||!!c.insta,'Site ou Instagram pesquisado'],[!!c.tem,'Revisar o que a empresa já tem'],[c.status==='novo'||!!c.ultimo,'Primeiro contato registrado'],[c.status!=='proc'||!!c.prox,'Próximo passo agendado'],[c.status==='novo'||!!(c.hist||[]).length,'Histórico de contatos registrado']];if(c.status==='ativo')L.push([c.dep==='Sim','Depoimento / case obtido']);return L}
function fic(id){const c=C.find(x=>x.id===id);E=id;const t=c.tem||[],P=pend(c),ok=P.filter(x=>x[0]).length,d=dg(c.fone),of=[...new Set(FL.filter(f=>!t.includes(f[0])).map(f=>f[2]))],q=x=>'\''+x+'\'';
$('md').innerHTML='<div class="rw" style="justify-content:space-between"><h3 style="margin:0">'+esc(c.nome)+'</h3><button onclick="cl2()">Fechar</button></div><div class="m">'+esc(c.cidade)+' · '+esc(c.segmento||'—')+' · '+ST[c.status]+(c.status==='proc'?' · '+esc(c.etapa||ET[0]):'')+'</div>'
+'<div class="rw"><button class="pri" onclick="msg('+q(id)+')">Mensagem</button><button onclick="ed('+q(id)+')">Editar dados</button></div>'
+'<label>Contato</label><div>'+(d?esc(c.fone):'<span class="b yl">sem telefone</span>')+(c.resp?' · '+esc(c.resp):'')+'</div>'+(c.site?'<div class="s">Site: '+esc(c.site)+'</div>':'')+(c.insta?'<div class="s">Instagram: '+esc(c.insta)+'</div>':'')
+'<label>O que a empresa já tem (toque para marcar)</label><div class="rw">'+FL.map(f=>'<button class="b'+(t.includes(f[0])?' gn':'')+'" onclick="tg('+q(id)+','+q(f[0])+')">'+(t.includes(f[0])?'✓ ':'')+f[1]+'</button>').join('')+'<button class="b" onclick="tg('+q(id)+',\'\')">Já revisei</button></div>'
+'<label>Oportunidades (o que falta)</label><div class="s">'+(c.tem?(of.length?of.map(esc).join(' · '):'Tudo mapeado: nada pendente.'):'Marque acima o que a empresa já tem para ver as oportunidades.')+'</div>'
+'<label>Ficha '+ok+'/'+P.length+' completa</label>'+P.map(x=>'<div class="s">'+(x[0]?'✓':'○')+' '+x[1]+'</div>').join('')
+'<label>Lembretes e tarefas</label>'+(c.tasks||[]).map((k,i)=>'<div class="rw"><input type="checkbox"'+(k.ok?' checked':'')+' style="width:auto" onchange="tkk('+i+')"><span'+(k.ok?' class="s"':'')+'>'+esc(k.t)+' <span class="s">'+k.d.split('-').reverse().slice(0,2).join('/')+'</span></span></div>').join('')
+'<div class="g2" style="grid-template-columns:1fr 130px auto;margin-top:6px"><input id="k_t" placeholder="Ex.: ligar para o gestor"><input id="k_d" type="date" value="'+add(1)+'"><button onclick="ak()">Adicionar</button></div>'
+(c.notas?'<label>Notas</label><div class="s">'+esc(c.notas)+'</div>':'')+'<label>Últimos contatos</label>'+((c.hist||[]).slice(-6).reverse().map(x=>'<div class="s">'+x.d.split('-').reverse().join('/')+' · <b>'+esc(x.tp)+'</b> · '+esc(x.t)+'</div>').join('')||'<div class="s">Nenhum registro ainda.</div>');$('ov').classList.add('on')}
function tg(id,k){const c=C.find(x=>x.id===id);c.tem=c.tem||[];if(k)c.tem=c.tem.includes(k)?c.tem.filter(x=>x!==k):[...c.tem,k];save();fic(id);rd()}
function ak(){const c=C.find(x=>x.id===E),t=$('k_t').value.trim();if(!t){toast('Escreva o lembrete.');return}(c.tasks=c.tasks||[]).push({t,d:$('k_d').value||add(1),ok:false});save();fic(E);rd()}
function tkk(i){const c=C.find(x=>x.id===E);c.tasks[i].ok=!c.tasks[i].ok;save();fic(E);rd()}
function hist(c){if(!c.id)return'<div class="s" style="margin-top:8px">Salve o cliente para registrar o histórico de contatos.</div>';const h=(c.hist||[]).slice(-5).reverse();return'<label>Histórico de contatos</label>'+h.map(x=>'<div class="s">'+x.d.split('-').reverse().join('/')+' · <b>'+esc(x.tp)+'</b> · '+esc(x.t)+'</div>').join('')+'<div class="g2" style="grid-template-columns:120px 1fr auto;margin-top:4px"><select id="h_tp">'+TP.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="h_t" placeholder="O que foi dito ou combinado"><button onclick="addH()">Adicionar</button></div>'}
function addH(){const c=C.find(x=>x.id===E),t=$('h_t').value.trim();if(!t)return;(c.hist=c.hist||[]).push({d:TD,tp:$('h_tp').value,t});c.ultimo=TD;save();ed(E);rd()}
function ext(){const tl=[];C.forEach(c=>(c.tasks||[]).forEach(k=>{if(!k.ok&&k.d<=TD)tl.push([c,k])}));$('tkl').innerHTML=tl.length?'<div class="al"><h2>Lembretes de hoje e atrasados ('+tl.length+')</h2>'+tl.slice(0,8).map(x=>'<div onclick="fic(\''+x[0].id+'\')">• <b>'+esc(x[0].nome)+'</b>: '+esc(x[1].t)+' · '+(x[1].d<TD?'atrasado':'hoje')+'</div>').join('')+'</div>':'';const m=new Date();m.setDate(m.getDate()-((m.getDay()+6)%7));const ws=iso(m),n={};TP.forEach(t=>n[t]=0);
C.forEach(c=>(c.hist||[]).forEach(h=>{if(h.d>=ws&&n[h.tp]!==undefined)n[h.tp]++}));
$('mt').innerHTML='<div class="al" style="border-color:var(--bd)"><h2 style="color:var(--tx)">Metas da semana</h2><div class="k" style="margin:0">'+TP.map(t=>'<div class="kc"><b>'+n[t]+' / <input type="number" min="0" value="'+G[t]+'" style="width:56px;padding:2px 4px" onchange="G[\''+t+'\']=+this.value||0;save();ext()"></b><span>'+t+'s</span><div style="height:5px;background:var(--bd);border-radius:9px;margin-top:6px"><div style="height:5px;border-radius:9px;background:var(--ac);width:'+Math.min(100,G[t]?n[t]/G[t]*100:0)+'%"></div></div></div>').join('')+'</div></div>';
const fe={};ET.forEach(e=>fe[e]=0);C.filter(c=>c.status==='proc').forEach(c=>fe[c.etapa||ET[0]]++);
$('fn').innerHTML='<div class="rw" style="margin-bottom:10px">'+ET.map(e=>'<button class="b'+(F.et===e?' gn':'')+'" onclick="F.et=F.et===\''+e+'\'?\'\':\''+e+'\';if(F.et)F.st=\'proc\';rd()">'+e+' · '+fe[e]+'</button>').join('')+'</div>';
const lost={},ind={};let dep=0,at=0;C.forEach(c=>{if(c.status==='inativo'&&c.motivo)lost[c.motivo]=(lost[c.motivo]||0)+1;if(c.indic)ind[c.indic]=(ind[c.indic]||0)+1;if(c.status==='ativo'){at++;if(c.dep==='Sim')dep++}});
const lk=Object.keys(lost).sort((a,b)=>lost[b]-lost[a]),tc=C.filter(c=>c.status!=='novo').length;
$('ins').innerHTML='<div class="r"><h3>Insights</h3><div class="m">Conversão: '+(tc?Math.round(at/tc*100):0)+'% dos contatados viraram clientes ativos</div><div class="m">Motivos de perda: '+(lk.length?lk.map(k=>esc(k)+' ('+lost[k]+')').join(' · '):'nenhum ainda')+'</div><div class="m">Indicações recebidas: '+Object.values(ind).reduce((a,b)=>a+b,0)+' · Ativos com depoimento: '+dep+'/'+at+'</div></div>'}
function sel(id,l,v){return '<select id="'+id+'">'+l.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'}
function ed(id){E=id;const c=id?C.find(x=>x.id===id):{status:'novo',cidade:'',segmento:SG[0],servico:SV[0],ultimo:TD,prox:add(2)};
const cs=[...new Set(['Pinheiro','São Bento','Santa Helena','São Luís',...C.map(x=>x.cidade)])];
const I=(k,l,t)=>'<label>'+l+'<input id="f_'+k+'" '+(t||'')+' value="'+esc(c[k])+'"></label>';
$('md').innerHTML='<h3 style="margin:0">'+(id?'Editar cliente':'Novo cliente')+'</h3>'+I('nome','Nome')+'<div class="g2"><label>Cidade<input id="f_cidade" list="cl" value="'+esc(c.cidade)+'"><datalist id="cl">'+cs.map(x=>'<option>'+esc(x)+'</option>').join('')+'</datalist></label>'+I('fone','WhatsApp / telefone')+'</div>'
+'<div class="g2">'+I('site','Site (link)')+I('insta','Instagram (@)')+'</div>'
+'<div class="g2"><label>Segmento'+sel('f_segmento',SG,c.segmento)+'</label><label>Serviço de interesse'+sel('f_servico',SV,c.servico)+'</label></div>'
+'<div class="g2"><label>Status'+'<select id="f_status">'+Object.keys(ST).map(s=>'<option value="'+s+'"'+(c.status===s?' selected':'')+'>'+ST[s]+'</option>').join('')+'</select></label>'+I('resp','Responsável / decisor')+'</div>'
+'<div class="g2"><label>Etapa (em processamento)'+sel('f_etapa',ET,c.etapa||ET[0])+'</label><label>Motivo de perda (se inativo)'+sel('f_motivo',MP,c.motivo||'')+'</label></div><div class="g2">'+I('indic','Indicado por')+'<label>Depoimento / case obtido'+sel('f_dep',['Não','Sim'],c.dep||'Não')+'</label></div>'
+'<div class="g2">'+I('ultimo','Último contato','type="date"')+I('prox','Próximo follow-up','type="date"')+'</div>'
+'<div class="g2">'+I('setup','Implantação (R$)','type="number"')+I('mensal','Mensalidade (R$)','type="number"')+'</div>'
+hist(c)+'<label>Notas<textarea id="f_notas" rows="3">'+esc(c.notas)+'</textarea></label>'
+'<div class="rw" style="margin-top:12px"><button class="pri" onclick="sv2()">Salvar</button><button onclick="cl2()">Cancelar</button>'+(id?'<button style="margin-left:auto;color:var(--rd)" onclick="del()">Excluir</button>':'')+'</div>';$('ov').classList.add('on')}
function cl2(){$('ov').classList.remove('on')}
function sv2(){const g=k=>$('f_'+k).value.trim(),o={nome:g('nome'),cidade:g('cidade'),fone:g('fone'),segmento:g('segmento'),servico:g('servico'),status:g('status'),resp:g('resp'),ultimo:g('ultimo'),prox:g('prox'),setup:g('setup'),mensal:g('mensal'),notas:g('notas'),etapa:g('etapa'),motivo:g('motivo'),indic:g('indic'),dep:g('dep'),site:g('site'),insta:g('insta')};
if(!o.nome||!o.cidade){toast('Preencha nome e cidade.');return}
if(o.status==='inativo'&&!o.motivo){toast('Informe o motivo de perda.');return}
if(E){Object.assign(C.find(x=>x.id===E),o)}else{o.id='c'+Date.now();C.push(o)}save();cl2();rd()}
function del(){if(!del.k){del.k=1;toast('Toque em Excluir de novo para confirmar');setTimeout(()=>del.k=0,4000);return}del.k=0;C=C.filter(x=>x.id!==E);save();cl2();rd()}
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
async function exp(){const h=['nome','cidade','segmento','servico','status','etapa','motivo','indic','dep','fone','resp','site','insta','ultimo','prox','setup','mensal','notas'];const csv='\ufeff'+h.join(';')+'\n'+C.map(c=>h.map(k=>'"'+String(c[k]==null?'':c[k]).replace(/"/g,'""')+'"').join(';')).join('\n');let ok=false;
try{const d=await window.claude.use('downloads');if(d){await d.save({filename:'clientes-luminex.csv',data:csv});ok=true}}catch(e){console.error(e)}
if(ok){toast('Arquivo exportado');return}
$('md').innerHTML='<h3 style="margin:0">Exportar CSV</h3><div class="s">O download não está disponível aqui. Copie o texto e cole em uma planilha ou bloco de notas.</div><textarea id="m_t" rows="12" readonly>'+esc(csv)+'</textarea><div class="rw" style="margin-top:10px"><button class="pri" onclick="cpy()">Copiar</button><button onclick="cl2()">Fechar</button></div>';$('ov').classList.add('on')}
(async()=>{try{const u=await window.claude.use('user'),d=await window.claude.use('db');if(u&&d){const id=await u.id();if(id){doc=d.collection('data/users/'+id).doc('crm');const s=await doc.get();if(s.exists){C=s.data().clients||[];G=s.data().goals||G}}}}catch(e){console.error(e)}
if(!doc)$('bn').textContent='Aviso: sem armazenamento nesta visualização; os dados não serão salvos.';rd()})();
rd();
</script></body></html>
